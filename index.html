<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IncentiWise — Global Incentive Platform (Prototype)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.0/echarts.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ===== Design tokens — PASTEL THEME v2 (Poppins) ===== */
:root{
--bg-canvas:#F5F6F9;--bg-surface:#FFFFFF;--bg-raised:#FFFFFF;--bg-sunken:#F0F2F6;--bg-hover:#EFF1F6;--bg-selected:#E4E9F1;
--text-primary:#2B3242;--text-secondary:#5E6A82;--text-muted:#9AA5BA;--text-inverse:#FFFFFF;
--border:#E6E9F0;--border-strong:#D3D9E4;--focus:#5B6B8C;
--accent:#5B6B8C;--accent-hover:#4A5876;--accent-subtle:#ECEFF5;--accent-grad:linear-gradient(120deg,#7284A8,#4A5876);
--ok:#2E9E6B;--ok-bg:#E4F6EC;--warn:#C08A2D;--warn-bg:#FBF2DF;--err:#D5605C;--err-bg:#FBE9E8;--info:#5088D0;--info-bg:#E8F1FB;--locked:#9A6DD7;--locked-bg:#F2EAFB;
--c1:#2F6DB5;--c2:#1F9E7A;--c3:#C97A35;--c4:#B85A8C;
--p1:#ECEFF5;--p2:#E0F3EF;--p3:#FBEEDF;--p4:#F9E8F1;--p5:#E6F0FB;
--shadow1:0 2px 6px rgba(74,88,118,.08),0 1px 2px rgba(46,42,69,.05);--shadow2:0 10px 28px rgba(74,88,118,.16);
--r:14px;--r-sm:10px;
}
[data-theme="dark"]{
--bg-canvas:#14181F;--bg-surface:#1A1F29;--bg-raised:#222834;--bg-sunken:#181D26;--bg-hover:#232936;--bg-selected:#323C50;
--text-primary:#E8EBF2;--text-secondary:#A5AFC4;--text-muted:#6B7590;--text-inverse:#16142A;
--border:#28303F;--border-strong:#3A4558;--focus:#93A5C8;
--accent:#93A5C8;--accent-hover:#ACBBD8;--accent-subtle:#242B3A;--accent-grad:linear-gradient(120deg,#7284A8,#4A5876);
--ok:#5FCF9B;--ok-bg:#1A3328;--warn:#E9B657;--warn-bg:#332A16;--err:#EF8B87;--err-bg:#361C1E;--info:#7FB1EE;--info-bg:#1B2A40;--locked:#B9A6E8;--locked-bg:#282238;
--c1:#6FA8E8;--c2:#4FC0A5;--c3:#EDAF6F;--c4:#E393BE;
--p1:#242B3A;--p2:#1C3833;--p3:#3A2E1C;--p4:#3A2233;--p5:#1E2C42;
--shadow1:0 2px 6px rgba(0,0,0,.35);--shadow2:0 12px 30px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
b,strong{font-weight:600}h1,h2,h3{font-weight:600}
html,body{height:100%}
body{font:12.5px/1.5 'Poppins',system-ui,-apple-system,sans-serif;color:var(--text-primary);background:var(--bg-canvas);overflow:hidden}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:4px}
/* ===== Layout: topbar / leftnav / list / detail ===== */
#app{display:grid;grid-template-rows:48px 1fr;height:100vh}
#topbar{display:flex;align-items:center;gap:12px;padding:0 14px;background:var(--bg-surface);border-bottom:1px solid var(--border);z-index:50}
#main{display:grid;grid-template-columns:auto 1fr;min-height:0}
#leftnav{width:220px;background:var(--bg-surface);border-right:1px solid var(--border);overflow-y:auto;padding:8px 0;transition:width .15s}
#leftnav.rail{width:52px}
#leftnav.rail .nl{display:none}
#content{overflow:hidden;display:flex;flex-direction:column;min-width:0}
.logo{font-weight:600;font-size:14px;color:var(--accent);display:flex;gap:8px;align-items:center;white-space:nowrap}
.logo .mark{width:26px;height:26px;border-radius:9px;background:var(--accent-grad);color:var(--accent-fg,#fff);display:flex;align-items:center;justify-content:center;font-size:12px;box-shadow:var(--shadow1)}
.ctx{font-size:11px;color:var(--text-muted);border:1px solid var(--border);border-radius:20px;padding:2px 10px;white-space:nowrap}
#gsearch{flex:1;max-width:520px;position:relative}
#gsearch input{width:100%;padding:6px 12px 6px 30px;border:1px solid var(--border);border-radius:20px;background:var(--bg-sunken);color:var(--text-primary);outline:none}
#gsearch input:focus{border-color:var(--focus);box-shadow:0 0 0 2px var(--accent-subtle)}
#gsearch .ico{position:absolute;left:10px;top:7px;color:var(--text-muted)}
.tb-btn{position:relative;width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px}
.tb-btn:hover{background:var(--bg-hover)}
.tb-badge{position:absolute;top:2px;right:2px;background:var(--err);color:#fff;font-size:9px;border-radius:8px;min-width:14px;height:14px;display:flex;align-items:center;justify-content:center;padding:0 3px}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--c4);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600}
/* nav */
.nav-group{margin:2px 8px 10px}
.nav-h{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--text-muted);padding:6px 10px 2px}
.nav-i{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;color:var(--text-secondary);width:100%;text-align:left;font-size:12.5px}
.nav-i:hover{background:var(--bg-hover);color:var(--text-primary)}
.nav-i.on{background:var(--accent-subtle);color:var(--accent);font-weight:600}
.nav-i .ic{width:18px;text-align:center;font-size:14px;flex:none}
/* panes */
.pane-h{padding:12px 18px 0;background:var(--bg-surface);border-bottom:1px solid var(--border)}
.crumbs{font-size:11px;color:var(--text-muted);margin-bottom:4px}
.crumbs a{color:var(--text-muted);text-decoration:none}.crumbs a:hover{color:var(--accent)}
.ph-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-bottom:10px}
.ph-title{font-size:18px;font-weight:600}
.body-scroll{overflow-y:auto;flex:1;padding:16px 18px;min-height:0}
/* components */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;border-radius:20px;padding:2px 10px}
.pill.ok{color:var(--ok);background:var(--ok-bg)}.pill.warn{color:var(--warn);background:var(--warn-bg)}.pill.err{color:var(--err);background:var(--err-bg)}.pill.info{color:var(--info);background:var(--info-bg)}.pill.lock{color:var(--locked);background:var(--locked-bg)}.pill.n{color:var(--text-secondary);background:var(--bg-sunken)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 16px;border-radius:20px;font-weight:600;font-size:12px;border:1px solid var(--border-strong);background:var(--bg-surface);color:var(--text-primary)}
.btn:hover{background:var(--bg-hover)}
.btn.pri{background:var(--accent-grad);border-color:transparent;color:var(--accent-fg,#fff);box-shadow:var(--shadow1)}.btn.pri:hover{filter:brightness(1.06)}
.btn.sm{padding:3px 10px;font-size:11.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow1)}
.card-h{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;font-weight:600;font-size:12.5px}
.card-h .exp{margin-left:auto;color:var(--text-muted);font-size:11px}
.card-b{padding:12px 14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.tile{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow1);position:relative;overflow:hidden}
.tile::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--accent-grad);opacity:.65}
.tile.t2::before{background:linear-gradient(120deg,#34B39A,#1F9483)}.tile.t3::before{background:linear-gradient(120deg,#E0954C,#C97A35)}.tile.t4::before{background:linear-gradient(120deg,#D077A6,#B85A8C)}
.tile .tl{font-size:10.5px;color:var(--text-secondary);font-weight:500}.tile .tv{font-size:21px;font-weight:600;margin:2px 0}.tile .td{font-size:10.5px;color:var(--text-muted)}
.tile .up{color:var(--ok)}.tile .down{color:var(--err)}
/* tables */
table.lv{width:100%;border-collapse:collapse;font-size:12.5px}
.lv th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--text-muted);padding:7px 10px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg-surface);white-space:nowrap}
.lv td{padding:7px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
.lv tbody tr:hover{background:var(--bg-hover);cursor:pointer}
.lv .num{text-align:right;font-variant-numeric:tabular-nums}
.lv .link{color:var(--accent);font-weight:600}
/* list controls */
.lc{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 0}
.chip{font-size:11.5px;padding:3px 11px;border-radius:16px;border:1px solid var(--border);color:var(--text-secondary);background:var(--bg-surface)}
.chip.on{background:var(--accent-subtle);border-color:var(--accent);color:var(--accent);font-weight:600}
.lc .sp{flex:1}
.cxs{font-size:11.5px;padding:4px 8px;border:1px solid var(--border-strong);border-radius:16px;background:var(--bg-surface);color:var(--text-primary);outline:none;max-width:190px}
.cxs:focus{border-color:var(--focus)}
.lc input{padding:5px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg-surface);color:var(--text-primary);outline:none;font-size:12px}
/* tabs */
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--border);background:var(--bg-surface);padding:0 18px}
.tab{padding:9px 13px;font-size:12.5px;font-weight:600;color:var(--text-secondary);border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{color:var(--text-primary)}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:8px;overflow:hidden}
.seg button{padding:4px 12px;font-size:11.5px;font-weight:600;color:var(--text-secondary);background:var(--bg-surface)}
.seg button.on{background:var(--accent);color:var(--accent-fg,#fff)}
/* kanban */
.kb{display:grid;grid-auto-flow:column;grid-auto-columns:230px;gap:12px;overflow-x:auto;padding-bottom:10px}
.kb-lane{background:var(--bg-sunken);border-radius:var(--r);padding:8px;min-height:200px}
.kb-lh{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--text-secondary);padding:4px 6px 8px;display:flex;justify-content:space-between}
.kb-card{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--r-sm);padding:8px 10px;margin-bottom:8px;box-shadow:var(--shadow1)}
.kb-card .kt{font-weight:600;font-size:12px;margin-bottom:4px}
.kb-card .km{font-size:11px;color:var(--text-muted);display:flex;justify-content:space-between}
.kb-lane.gated{outline:2px dashed var(--warn);outline-offset:-2px}
/* modal + drawer */
#ovl{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;z-index:100}
#ovl.show{display:flex}
.modal{background:var(--bg-raised);border-radius:12px;box-shadow:var(--shadow2);width:560px;max-width:92vw;max-height:86vh;overflow-y:auto}
.modal-h{padding:14px 18px;border-bottom:1px solid var(--border);font-weight:600;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.modal-b{padding:16px 18px}
.modal-f{padding:12px 18px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:11px;font-weight:600;color:var(--text-secondary);margin-bottom:4px}
.fld input,.fld textarea,.fld select{width:100%;padding:7px 10px;border:1px solid var(--border-strong);border-radius:8px;background:var(--bg-surface);color:var(--text-primary);outline:none;font:inherit}
.fld textarea{min-height:64px;resize:vertical}
.fld input:focus,.fld textarea:focus{border-color:var(--focus)}
.note{font-size:11.5px;color:var(--text-secondary);background:var(--bg-sunken);border-radius:8px;padding:8px 10px;margin:8px 0}
.note.w{background:var(--warn-bg);color:var(--warn)}
/* drawers (notifications/jobs) */
.drawer{position:fixed;top:48px;right:0;width:360px;bottom:0;background:var(--bg-raised);border-left:1px solid var(--border);box-shadow:var(--shadow2);z-index:90;display:none;flex-direction:column}
.drawer.show{display:flex}
.drawer-h{padding:12px 16px;font-weight:600;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.drawer-b{overflow-y:auto;flex:1;padding:8px}
.ntf{padding:10px 12px;border-radius:8px;margin-bottom:6px;border:1px solid var(--border);background:var(--bg-surface)}
.ntf .nt{font-size:12px;font-weight:600}.ntf .nm{font-size:11.5px;color:var(--text-secondary);margin-top:2px}.ntf .nd{font-size:10.5px;color:var(--text-muted);margin-top:4px}
.ntf.unread{border-left:3px solid var(--accent)}
.prog{height:6px;background:var(--bg-sunken);border-radius:3px;overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .4s}
/* timeline */
.tl-item{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:12px}
.tl-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:5px;flex:none}
.tl-meta{color:var(--text-muted);font-size:11px}
.chan{font-size:10px;font-weight:600;text-transform:uppercase;color:var(--text-muted);border:1px solid var(--border);border-radius:4px;padding:0 4px;margin-left:6px}
/* misc */
.tree-i{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:6px;font-size:12.5px;cursor:pointer}
.tree-i:hover{background:var(--bg-hover)}
.tree-i.on{background:var(--accent-subtle);color:var(--accent);font-weight:600}
.ind1{margin-left:18px}.ind2{margin-left:36px}
.sec{margin-bottom:14px}
.sec-h{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;padding:6px 0;cursor:pointer;user-select:none}
.sec-h .car{transition:transform .15s;font-size:10px;color:var(--text-muted)}
.sec.closed .sec-b{display:none}.sec.closed .car{transform:rotate(-90deg)}
.readiness{display:flex;align-items:center;gap:10px}
.rbar{flex:1;height:8px;border-radius:4px;background:var(--bg-sunken);overflow:hidden}
.rbar i{display:block;height:100%;border-radius:4px}
.prov{cursor:pointer;border-bottom:1px dashed var(--accent);color:var(--accent);font-weight:600}
.diffadd{background:var(--ok-bg);color:var(--ok)}.diffdel{background:var(--err-bg);color:var(--err);text-decoration:line-through}
.chart{height:230px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--text-primary);color:var(--bg-surface);padding:9px 18px;border-radius:20px;font-size:12.5px;font-weight:600;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.src-badge{font-size:9.5px;font-weight:600;text-transform:uppercase;border-radius:4px;padding:1px 5px}
.src-computed{background:var(--bg-sunken);color:var(--text-secondary)}.src-manual{background:var(--info-bg);color:var(--info)}.src-ai{background:var(--accent-subtle);color:var(--accent)}.src-redist{background:var(--warn-bg);color:var(--warn)}
.gate{border:1px dashed var(--warn);background:var(--warn-bg);border-radius:8px;padding:10px 12px;font-size:12px;color:var(--warn);font-weight:600}
.gate.pass{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
kbd{background:var(--bg-sunken);border:1px solid var(--border-strong);border-radius:4px;padding:0 5px;font-size:10.5px}
#gs-results{position:absolute;top:36px;left:0;right:0;background:var(--bg-raised);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow2);max-height:380px;overflow-y:auto;display:none;z-index:120}
#gs-results.show{display:block}
.gsr{padding:8px 12px;display:flex;gap:10px;align-items:center;cursor:pointer;font-size:12.5px}
.gsr:hover{background:var(--bg-hover)}
.gsr .ent{font-size:9.5px;font-weight:600;text-transform:uppercase;color:var(--text-muted);border:1px solid var(--border);border-radius:4px;padding:1px 5px;min-width:52px;text-align:center}
.facets{display:flex;gap:6px;padding:8px 12px;border-bottom:1px solid var(--border)}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <button class="tb-btn" onclick="toggleNav()" title="Collapse navigation"><span data-ic="menu"></span></button>
    <div class="logo"><span class="mark">iW</span><span class="nl">Incenti<b style="font-weight:600">Wise</b></span></div>
    <span class="ctx">Certainti.Ai · FY2025 · <b>All Territories</b></span>
    <div id="gsearch"><span class="ico"><span data-ic="search"></span></span><input id="gsi" placeholder="Search accounts, cases, projects, productions…  ( / )" oninput="gSearch(this.value)" onfocus="gSearch(this.value)"><div id="gs-results"></div></div>
    <button class="tb-btn" title="Background jobs" onclick="toggleDrawer('jobs')"><span data-ic="activity"></span><span class="tb-badge" id="jobs-badge" style="display:none">0</span></button>
    <button class="tb-btn" title="Notifications" onclick="toggleDrawer('ntf')"><span data-ic="bell"></span><span class="tb-badge" id="ntf-badge">3</span></button>
    <button class="tb-btn" title="Color palette settings" onclick="toggleDrawer('pal')"><span data-ic="settings"></span></button>
    <button class="tb-btn" title="Toggle Dark / Light theme" onclick="toggleTheme()" id="theme-btn"><span data-ic="moon"></span></button>
    <div class="avatar" title="John Doe — ProfessionalServicesConsultantLead">JD</div>
  </div>
  <div id="main">
    <nav id="leftnav"></nav>
    <div id="content"></div>
  </div>
</div>
<div id="ovl" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal"></div></div>
<div class="drawer" id="drawer-ntf"><div class="drawer-h">Notifications <button class="btn sm" onclick="toggleDrawer('ntf')">✕</button></div><div class="drawer-b" id="ntf-list"></div></div>
<div class="drawer" id="drawer-jobs"><div class="drawer-h">Background Jobs <button class="btn sm" onclick="toggleDrawer('jobs')">✕</button></div><div class="drawer-b" id="jobs-list"></div></div>
<div class="drawer" id="drawer-pal"><div class="drawer-h">🎨 Appearance & Palette <button class="btn sm" onclick="toggleDrawer('pal')">✕</button></div><div class="drawer-b" id="pal-body"></div></div>
<div class="toast" id="toast"></div>
<script>
/* Lucide-style inline SVG icons (ISC) — modern replacement for emoji */
const ICONS={
home:'<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>',
building:'<rect x="4" y="2" width="16" height="20" rx="2"/><path d="M9 22v-4h6v4"/><path d="M8 6h.01M16 6h.01M12 6h.01M12 10h.01M12 14h.01M16 10h.01M16 14h.01M8 10h.01M8 14h.01"/>',
landmark:'<line x1="3" y1="22" x2="21" y2="22"/><line x1="6" y1="18" x2="6" y2="11"/><line x1="10" y1="18" x2="10" y2="11"/><line x1="14" y1="18" x2="14" y2="11"/><line x1="18" y1="18" x2="18" y2="11"/><polygon points="12 2 20 7 4 7"/>',
users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
user:'<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
